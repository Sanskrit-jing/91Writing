name: Tauri Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './91xiezuo-tauri/src-tauri -> target'

      - name: Install frontend dependencies
        working-directory: ./91xiezuo-tauri
        run: npm install

      - name: Build frontend
        working-directory: ./91xiezuo-tauri
        run: npm run build

      - name: Build Tauri app
        working-directory: ./91xiezuo-tauri
        run: npx tauri build

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: 91xiezuo-tauri-windows
          path: 91xiezuo-tauri/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
